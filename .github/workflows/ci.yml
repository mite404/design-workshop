# Commits ship straight to main (ADR-017), so every push there runs the checks agents ran by hand.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter storybook exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm fallow
      - run: pnpm test
      # The browser levers drive the Workbench on the dev server and write overrides.css, so they
      # run one at a time against one server that the step starts and stops itself.
      - name: pnpm test:browser
        run: |
          (cd apps/web && exec node_modules/.bin/react-router dev --port 5173 --strictPort) > /tmp/web.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          timeout 120 bash -c 'until curl -sf http://localhost:5173/ > /dev/null; do sleep 1; done' || { cat /tmp/web.log; exit 1; }
          pnpm test:browser
      - run: pnpm build
      - run: pnpm build-storybook
