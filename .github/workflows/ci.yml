# Commits ship straight to main (ADR-017), so every push there runs the checks agents ran by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter storybook exec playwright install chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Not `fallow --ci`: fallow 3.29 exits 0 under its SARIF format even with findings.
      - run: pnpm fallow:ci
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-storybook

  browser:
    name: Browser (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [selection, editing, stories]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter storybook exec playwright install chromium
      # Each group has its own checkout: browser writers must never share overrides.css with
      # another group, Vitest or a build. Scripts within a group still run one at a time.
      - name: pnpm test:browser:${{ matrix.group }}
        run: |
          (cd apps/web && exec node_modules/.bin/react-router dev --port 5173 --strictPort) > /tmp/web.log 2>&1 &
          server=$!
          storybook=""
          trap 'kill "$server"; if [ -n "$storybook" ]; then kill "$storybook"; fi' EXIT
          timeout 120 bash -c 'until curl -sf http://localhost:5173/ > /dev/null; do sleep 1; done' || { cat /tmp/web.log; exit 1; }
          if [ '${{ matrix.group }}' = stories ]; then
            (cd apps/storybook && exec node_modules/.bin/storybook dev -p 6006 --ci --no-open) > /tmp/storybook.log 2>&1 &
            storybook=$!
            timeout 120 bash -c 'until curl -sf http://localhost:5173/__stories/index.json > /dev/null; do sleep 1; done' || { cat /tmp/storybook.log; exit 1; }
          fi
          pnpm test:browser:${{ matrix.group }}
          if [ -n "$storybook" ]; then
            kill "$storybook"
            wait "$storybook" || true
            storybook=""
            node apps/web/scripts/story-component-check.mjs --offline
          fi
